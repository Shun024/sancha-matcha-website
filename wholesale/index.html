<script>
/* Palette preview — override brand colours via URL params (harmless with no param). */
(function () {
  try {
    var q = new URLSearchParams(location.search), root = document.documentElement;
    function hex(v) { v = (v || "").trim().replace(/^#/, ""); return /^[0-9a-fA-F]{3,8}$/.test(v) ? "#" + v : null; }
    var y = hex(q.get("yellow"));
    if (y) { root.style.setProperty("--paper", y); root.style.setProperty("--lemon", y); }
    ["matcha","matcha-deep","forest","cream","paper","charcoal","stone","muted","line","peach","blue","maroon","lemon"]
      .forEach(function (name) { var c = hex(q.get(name)); if (c) root.style.setProperty("--" + name, c); });
  } catch (e) {}
})();
</script>
