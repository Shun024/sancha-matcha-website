<script>
/* Palette preview — override brand colours via URL params (harmless with no param). */
(function () {
  try {
    var q = new URLSearchParams(location.search), root = document.documentElement;
    function hex(v) { v = (v || "").trim().replace(/^#/, ""); return /^[0-9a-fA-F]{3,8}$/.test(v) ? "#" + v : null; }
    var y = hex(q.get("yellow"));
    if (y) { root.style.setProperty("--paper", y); root.style.setProperty("--lemon", y); }
    ["matcha","matcha-deep","forest","cream","paper","charcoal","stone","muted","line","peach","blue","maroon","lemon"]
      .forEach(function (name) { var c = hex(q.get(name)); if (c) root.style.setProperty("--" + name, c); });
  } catch (e) {}
})();
</script>

<section class="visit" id="contact">

        <p class="contact-sub">Questions, feedback or anything else — drop us a message and we'll get back to you.</p>
        <form class="contact-form" onsubmit="return handleContact(event)" novalidate>
          <input name="Name" placeholder="Your name" aria-label="Your name" autocomplete="name" required>
          <input type="email" name="Email" placeholder="you@example.com" aria-label="Email address" autocomplete="email" required>

          <input type="text" name="company_hp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button type="submit">Send message</button>
          <p class="form-msg" hidden></p>
        </form>
      </div>
    </div>
  </div>
</section>
